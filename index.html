<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="생각하고 배운 것을 기록하는 블로그">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <script>
    // 깜빡임을 막기 위해 CSS보다 먼저 테마를 정한다
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'dark' && theme !== 'light') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="list">
  <a class="skip-link" href="#content">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="테마 전환"></button>
    </div>
  </header>

  <main id="content" class="container">
    <section class="intro">
      <h1>My Blog</h1>
      <p>생각하고 배운 것을 기록합니다.</p>
    </section>
    <div id="app">
      <p class="status">불러오는 중…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 My Blog</p>
    </div>
  </footer>
</body>
</html>
